# The environment GitHub Actions runs passes and tests in (.github/workflows/). Only what a pass needs; the full
# development environment (notebooks etc.) is environment.yml. cfgrib needs the eccodes C library: conda-forge.
name: cwx-ci
channels:
  - conda-forge
dependencies:
  - python=3.13
  - eccodes
  - cfgrib
  - xarray
  - numpy
  - pandas>=3
  - pyarrow
  - pyyaml
  - requests
  - metpy
  - boto3
  - herbie-data=2026.9.2      # pinned to the laptop's version: a Herbie update once changed which ECMWF file it fetched
